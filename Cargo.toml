[workspace]
resolver = "3"
members = ["crates/sim", "crates/game", "crates/noita_data", "crates/re_tools", "crates/actors", "crates/box2d", "crates/probe", "crates/worldgen"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimize dependencies (Bevy) in dev builds; workspace crates keep debug settings.
[profile.dev.package."*"]
opt-level = 2
